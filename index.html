<!DOCTYPE html>
<html>
<head>
  <title>Houses</title>

  <style>
    * {
      box-sizing: border-box;
    }
    .picture img {
      width: 90%;
      object-fit: contain;
      flex: 1;

    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .container {
        display:flex;
        width: 90%;
        height: auto;
        padding: 20px;
        margin: 20px auto;
        border: 2px solid black;
        gap: 20px;
    }

    input {
        padding: 20px;
        flex: 1;
        width:40%;
    }
    button {
        cursor: pointer;
        width: 20%;
        height: 20%;
    }
    .house {
        display:flex;
        flex-direction: column;
        object-fit: contain;
    }
    .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
    }


  </style>
</head>
<script>
    var count= [];
    var floor = [];
    for(var i = 0; i<7; i++){
        count[i] = Math.floor(Math.random() * 10) + 1;
        floor[i] = count[i];
    }
    function change(i, ch){
        if(count[i]+ch>=floor[i] && count[i]+ch<=10){
            count[i] = count[i] + ch;
            var a = document.getElementById("stat"+i);
            a.value = count[i];
        }
    }
    function returnStat(){
        for(var i = 0; i<7; i++){
            var a = document.getElementById("stat"+i);
            a.value = count[i];
        }
    }
    returnStat();
</script>
<body>
  <div class="container">

    <div class="house">
      <h2>House 1</h2>

        <div class="card">

            <div class="picture"><img src="House1.png" alt="House 1"></div>

            <div class="row">
                <input type="text" id="stat0" readonly>
                <button onclick="change(0, -1)">-</button>
                <button onclick="change(0, 1)">+</button>
            </div>

            <div class="row">
                <input type="text" placeholder="placeholder">
                <button type="button">Click Me</button>
            </div>
        </div>
    </div> 

    <div class="house"> <!-- Start House 2 -->
      <h2>House 2</h2>

      <div class="card">

        <div class="picture"><img src="House1.png" alt="House 1"></div>

        <div class="row">
          <input type="text" placeholder="placeholder">
          <button type="button">Click Me</button>
        </div>

        <div class="row">
          <input type="text" placeholder="placeholder">
          <button type="button">Click Me</button>

        </div>
      </div>

    </div>

  </div>
</body>
</html>
