<!DOCTYPE html>
<html>
<head>
  <title>Houses</title>

  <style>
    * {
      box-sizing: border-box;
    }
    .picture img {
      width: 90%;
      object-fit: contain;
      flex: 1;

    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .container {
        display:flex;
        width: 90%;
        height: auto;
        padding: 20px;
        margin: 20px auto;
        border: 2px solid black;
        gap: 20px;
    }

    input {
        padding: 20px;
        flex: 1;
        width:40%;
    }
    button {
        cursor: pointer;
        width: 20%;
        height: 20%;
    }
    .house {
        display:flex;
        flex-direction: column;
        object-fit: contain;
    }
    .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
    }


  </style>
</head>



<body>
  <div class="container">

    <div class="house">
      <h2>House 1</h2>
      <p>cost: <span id="cost0">8</span></p>
        <div class="card">

            <div class="picture"><img src="House1.png" alt="House 1"></div>

            <div class="row">
                <input type="text" id="stat0" readonly>
                <button onclick="change(0, -1)">-</button>
                <button onclick="change(0, 1)">+</button>
            </div>

            <div class="row">
                <input type="text" id="stat1" readonly>
                <button onclick="change(1, -1)">-</button>
                <button onclick="change(1, 1)">+</button>
            </div>
        </div>
    </div> 

    <div class="house"> <!-- Start House 2 -->
      <h2>House 2</h2>
      <p>cost: <span id="cost1">8</span></p>
      <div class="card">

        <div class="picture"><img src="House1.png" alt="House 1"></div>

        <div class="row">
                <input type="text" id="stat7" readonly>
                <button onclick="change(7, -1)">-</button>
                <button onclick="change(7, 1)">+</button>
            </div>

        <div class="row">
                <input type="text" id="stat8" readonly>
                <button onclick="change(8, -1)">-</button>
                <button onclick="change(8, 1)">+</button>
            </div>
      </div>

    </div>

  </div>
</body>
</html>



<script>
    //house area, land area, quality, bed/bath, age 
    var total = [1000, 1000];
    var purchase = [20, 80, 10, 10, 30]
    var count= [];
    var floor = [];
    var cost = [8, 8];
    for(var i = 0; i<14; i++){
        count[i] = Math.floor(Math.random() * 10) + 1;
        floor[i] = count[i];
    }
    returnStat();
    function change(i, ch){
        var h = 0;
        var payment = purchase[i%7]*ch;
        if(i>=7) h = 1;
        if(count[i]+ch>=floor[i] && count[i]+ch<=10 
        && cost[h] - ch >=0 
        && cost[h] - ch <=8
        && total[h] - payment >=0){
            count[i] = count[i] + ch;
            cost[h] -= ch;
            total[h] -= payment;
            var a = document.getElementById("stat"+i);
            a.value = count[i];
            var b = document.getElementById("cost"+h);
            b.innerHTML = cost[h];
            var c = document.getElementById("total"+h);
            c.innerHTML = total[h];
        }
    }
    function returnStat(){
        for(var i = 0; i<14; i++){
            var a = document.getElementById("stat"+i);
            if(a== null) continue;
            a.value = count[i];
        }
    }
    returnStat();
</script>
